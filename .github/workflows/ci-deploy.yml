name: CI e deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Validar aplicação
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: github-actions-ci-only-0123456789abcdef0123456789abcdef
      ADMIN_EMAIL: ci@example.invalid
      TRUST_PROXY: 'false'

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar banco de teste
        run: |
          npm run db:generate
          npm run db:migrate

      - name: Validar codigo
        run: npm run check

      - name: Auditar dependencias
        run: npm audit --audit-level=high

      - name: Gerar build
        run: npm run build

  deploy:
    name: Publicar na AWS
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://aceprodutora.com.br
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}

    steps:
      - name: Configurar acesso SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$EC2_SSH_KEY"
          test -n "$EC2_KNOWN_HOSTS"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/ace-prod
          printf '%s\n' "$EC2_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/ace-prod ~/.ssh/known_hosts

      - name: Executar deploy com backup
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -i ~/.ssh/ace-prod "$EC2_USER@$EC2_HOST" \
            "set -Eeuo pipefail; \
             cd /home/ubuntu/ace-prod; \
             git fetch --prune origin main; \
             git show '$TARGET_SHA:scripts/deploy-production.sh' > /tmp/ace-prod-deploy.sh; \
             chmod 700 /tmp/ace-prod-deploy.sh; \
             /tmp/ace-prod-deploy.sh '$TARGET_SHA'; \
             rm -f /tmp/ace-prod-deploy.sh"

      - name: Remover chave do runner
        if: always()
        shell: bash
        run: rm -f ~/.ssh/ace-prod
